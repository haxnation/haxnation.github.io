name: Update Event Photo Galleries

on:
  schedule:
    - cron: '30 0 * * 0'
  workflow_dispatch:

jobs:
  update-gallery:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape posts and download photos
        working-directory: scripts
        run: npm run update-event-gallery

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mumbai-chapter/event-gallery.json mumbai-chapter/gallery
          if git diff --cached --quiet; then
            echo "No gallery changes"
            exit 0
          fi
          git commit -m "Auto-update event photo galleries from LinkedIn"
          git push
