<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://blog.haxnation.org/">
    <link rel="canonical" href="https://blog.haxnation.org/">
    <title>Redirecting to blog.haxnation.org...</title>
    <script>
        (function () {
            var rest = window.location.pathname.replace(/^\/blog\//, '').replace(/index\.html$/, '');
            var target = 'https://blog.haxnation.org/' + rest + window.location.search + window.location.hash;
            window.location.replace(target);
        })();
    </script>
</head>

<body>
    <p>If you are not redirected automatically, <a href="https://blog.haxnation.org/">click here</a>.</p>
</body>

</html>
